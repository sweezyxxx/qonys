<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QONYS scenario prototype</title>
<style>
:root{font-family:Arial,sans-serif;color:#183047;background:#eef2f5;font-size:15px;--blue:#2166ad;--line:#d7e0e8;--muted:#5b6f80}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{max-width:100%}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button,.control{border:1px solid var(--line);border-radius:8px;background:white;color:inherit;padding:10px 14px}button:hover{background:#eef5fc}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button[aria-pressed=true],.active{background:#e7f1fc;border-color:#2166ad;color:#14548c}.demo{background:#182d40;color:#fff;padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}.demo label{margin-left:auto}.demo select{padding:6px;border-radius:5px}.top{background:white;padding:20px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.brand{font-size:26px;font-weight:bold;letter-spacing:2px;color:#195b96;border:0;padding:0}.top .spacer{flex:1}.top button:not(.brand){font-size:14px}.routes{display:flex;gap:8px;flex-wrap:wrap;padding:14px 28px;background:#f8fafc;border-bottom:1px solid var(--line)}.routes button{padding:7px 12px;font-size:13px}.body{max-width:1180px;margin:auto;padding:30px 28px 48px;min-height:650px}h1{font-size:28px;margin:0 0 10px}h2{font-size:21px;margin:0 0 16px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.55}.muted{color:var(--muted)}.sub{font-size:13px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:24px}.card-art{height:190px;background:#e2edf3;border-radius:9px;display:flex;align-items:end;justify-content:center;gap:10px;padding:22px 30px 0;overflow:hidden;margin-bottom:16px}.tower{background:repeating-linear-gradient(to bottom,#e9f3f7 0 13px,#597c94 13px 18px);width:25%;height:100%;border:7px solid #7292a5}.tower:nth-child(2){height:80%}.tower:nth-child(3){height:65%}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field input,.field select,.field textarea{width:100%;border:1px solid #becbd7;background:white;border-radius:7px;padding:11px;color:inherit}.field textarea{min-height:86px;resize:vertical}.facts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.fact{border-bottom:1px solid var(--line);padding-bottom:10px}.fact span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.price{font-size:28px;font-weight:bold;margin:20px 0 18px}.status{display:inline-block;padding:5px 9px;background:#e6f3eb;color:#205d39;border-radius:5px;font-size:12px}.status.yellow{background:#fff1cd;color:#705012}.status.red{background:#fae5e3;color:#8d2e29}.actions{display:grid;gap:10px;margin-top:22px}.crumb{margin-bottom:20px;color:var(--muted);font-size:13px}.local{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0;padding-bottom:14px}.local span:first-child{font-weight:bold;color:#2166ad}.illustration{width:100%;max-height:490px;display:block}.floorarea{background:#fbfcfd;border:1px solid var(--line);padding:24px;border-radius:12px}.apartments{display:grid;grid-template-columns:1fr 1fr;gap:16px}.unit{border:2px solid #607b8b;padding:30px 15px;min-height:170px;background:white;color:#203747;text-align:center;position:relative}.unit.yellow{background:#fff4d8}.unit.red{background:#fbe5e2}.unit strong{display:block;font-size:20px;margin-bottom:15px}.corridor{padding:17px;text-align:center;background:#e8edf1;margin:15px 0}.sidebar{display:grid;grid-template-columns:220px 1fr;gap:24px}.side{display:flex;flex-direction:column;gap:6px}.side button{text-align:left;border-color:transparent}.side .active{border-color:var(--line)}.audit{display:grid;gap:10px;margin-top:16px}.audit div{padding:12px;background:#f4f7fa;border-radius:6px;font-size:13px}.notice{padding:13px 16px;border-radius:7px;background:#e9f2fc;line-height:1.45;margin:16px 0}.error{color:#922e2e;background:#fff0ef}.empty{padding:55px 20px;text-align:center;background:white;border:1px dashed #b6c8d5;border-radius:12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:13px;color:#53697c}.scroll{overflow:auto}.assistant{margin-top:22px;display:flex;justify-content:flex-end}.assistant button{border-radius:24px;background:#2166ad;color:white;border:0;padding:14px 20px}.chat{max-width:430px;margin-left:auto;box-shadow:0 8px 26px #16304720}.message{padding:12px;border-radius:8px;margin:12px 0;background:#f0f5f8}.message.buyer{background:#e0edfa;margin-left:35px}.dialog-backdrop{position:fixed;inset:0;background:#182d4066;z-index:5;display:grid;place-items:center;padding:20px}.dialog{width:min(460px,100%);background:white;border-radius:16px;padding:25px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}footer{padding:18px 28px;background:white;color:var(--muted);border-top:1px solid var(--line);font-size:12px}[hidden]{display:none!important}@media(max-width:740px){.body{padding:22px 16px;min-height:0}.top,.routes{padding:15px 16px}.top{gap:12px}.grid,.two,.sidebar,.compare{grid-template-columns:1fr}.demo{padding:10px 16px}.demo label{margin-left:0}.side{flex-direction:row;overflow:auto}.side button{white-space:nowrap}.panel{padding:18px}.card-art{height:160px}.price{font-size:25px}h1{font-size:24px}.illustration{max-height:380px}.routes button{flex:1}.table{min-width:510px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s}}
</style>
</head>
<body>
<div class="demo"><span>Design prototype · Fictional catalogue · Local interactions</span><label>Buyer state <select id="buyer-state"><option value="guest">Guest</option><option value="verified">Verified buyer</option></select></label></div>
<header class="top"><button class="brand" data-go="catalogue">QONYS</button><span class="control">Astana</span><span class="spacer"></span><button data-go="comparison">Comparison <span id="compare-count">0</span></button><span>EN</span><button id="account-button">Sign in</button></header>
<nav class="routes" aria-label="Prototype scenarios"><button data-go="catalogue">Catalogue</button><button data-go="development">Development</button><button data-go="floor">Floor</button><button data-go="apartment">Apartment</button><button data-go="enquiry">Enquiry</button><button data-go="developer">Developer</button><button data-go="admin">Administrator</button></nav>
<main id="main" class="body"></main><div id="modal" hidden></div>
<footer>QONYS analysis and design · 24 October 2026 · No backend, language model, email or real enquiry is connected.</footer>
<script>
(()=>{
const root=document.getElementById('main');
const state={page:'catalogue',buyer:'guest',finish:'base',compare:[],selected:'court',draftEn:'',publishedDraft:false,hidden:false,suspended:false,reason:'',enquiry:null,enquiryStatus:'New',developerTab:'Floor plans',regionReviewed:false,regionApartment:'34',shift:0,audit:[],assistant:false};
const choices={base:{name:'No finish',price:30900000,description:'Developer standard delivery without finishing. Example photographs are not supplied.'},whitebox:{name:'WhiteBox',price:32400000,description:'Pre-finish alternative supplied by the developer. Full apartment price includes this condition.'},finished:{name:'Finished',price:37200000,description:'Finished delivery alternative supplied by the developer. No generated interior is included.'}};
const price=n=>'₸'+n.toLocaleString('en-US');
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visible=()=>!state.hidden&&!state.suspended;
const project=()=>state.selected==='river'?'River Court':'Demo Court';
const plan=()=>`<svg class="illustration" viewBox="0 0 600 440" role="img" aria-label="Schematic three-room apartment layout"><rect x="65" y="45" width="470" height="335" fill="#fff" stroke="#647d86" stroke-width="14"/><path d="M260 45V185H535M65 240H260V380M385 185V380M260 185V240" fill="none" stroke="#647d86" stroke-width="10"/><path d="M260 190V225M385 235V285" stroke="#fff" stroke-width="15"/><path d="M260 190a40 40 0 0 1 40 40M385 235a45 45 0 0 0 45 45" fill="none" stroke="#b8c5c9" stroke-width="2"/><rect x="90" y="75" width="105" height="65" rx="5" fill="#eef2f3" stroke="#bdc9ce"/><rect x="100" y="275" width="110" height="70" fill="#eef2f3" stroke="#bdc9ce"/><rect x="410" y="270" width="90" height="80" fill="#eef2f3" stroke="#bdc9ce"/><circle cx="365" cy="110" r="34" fill="#f7f9fa" stroke="#b8c5c9"/><path d="M290 60H500V80H290Z" fill="#edf1f3" stroke="#b8c5c9"/><text x="170" y="180" fill="#3d5666" font-size="18" text-anchor="middle">Bedroom</text><text x="390" y="165" fill="#3d5666" font-size="18" text-anchor="middle">Kitchen and living</text><text x="160" y="365" fill="#3d5666" font-size="18" text-anchor="middle">Bedroom</text><text x="450" y="225" fill="#3d5666" font-size="18" text-anchor="middle">Bathroom</text><text x="315" y="320" fill="#3d5666" font-size="20" text-anchor="middle">62.8 m²</text></svg>`;
const tower=()=>`<svg class="illustration" viewBox="0 0 600 450" role="img" aria-label="Schematic facade with floor five highlighted"><rect width="600" height="450" fill="#e7f1f8"/><path d="M0 390Q100 350 180 390T400 385T600 375V450H0Z" fill="#a1b8ac"/><rect x="185" y="40" width="225" height="355" fill="#88a5b7" stroke="#547b96" stroke-width="3"/>${Array.from({length:12},(_,i)=>`<path d="M195 ${52+i*27}H400" stroke="#dbe9f0" stroke-width="15"/>`).join('')}<rect x="178" y="260" width="239" height="28" fill="#6bb8ef88" stroke="#1676b4" stroke-width="3"/><text x="430" y="280" fill="#174c70" font-size="19">Floor 5</text><path d="M170 395H430V420H170Z" fill="#587a8f"/></svg>`;
const crumb=()=>`<div class="crumb">Astana / ${project()} / Building 1 / Floor 5</div>`;
function card(title,id){return `<article class="panel"><div class="card-art" aria-hidden="true"><div class="tower"></div><div class="tower"></div><div class="tower"></div></div><span class="eyebrow">Sample Developer</span><h2>${title}</h2><p class="muted">Astana · Under construction · Q4 2027</p><p>From <strong>${price(30900000)}</strong></p><button class="primary" data-project="${id}">Explore development</button></article>`}
function catalogue(){return `<div class="row between"><div><div class="eyebrow">New homes</div><h1>Find a place that fits your life</h1><p class="muted">Explore residential developments in Astana.</p></div><span class="control">List view</span></div><div class="grid">${visible()?card('Demo Court','court')+(state.publishedDraft?card('River Court','river'):''):'<div class="empty">No public developments match this example catalogue.</div>'}</div>${assistant()}`}
function assistant(){if(!state.assistant)return `<div class="assistant"><button id="open-assistant">Find an apartment</button></div>`;return `<section class="panel chat" aria-label="Apartment selection example"><div class="row between"><h3>Find an apartment</h3><button id="close-assistant" aria-label="Close assistant">Close</button></div><div class="message buyer">Three rooms in Astana, up to ₸35 million.</div><div class="message">${visible()?'Apartment 34 matches the city, room count and budget with standard No finish delivery.':'There are no visible matches in this example catalogue.'}</div>${visible()?'<button data-go="apartment">Apartment 34 · ₸30,900,000</button>':''}<p class="sub muted">Scripted dialogue example</p></section>`}
function development(){if(!visible())return restricted();return `${crumb()}<h1>${project()}</h1><p class="muted">Sample Developer · Example street 10 · Under construction, Q4 2027</p><div class="local"><span>Overview</span><span>Layouts</span><span>Map and infrastructure</span></div><div class="two"><section class="panel">${tower()}</section><aside class="panel"><div class="eyebrow">Building 1 · Facade excerpt</div><h2>Floor 5</h2><p>1 available · 1 reserved · 1 sold</p><p class="muted">Open the floor plan to inspect the position of each apartment.</p><button class="primary" data-go="floor">View floor 5</button><p class="sub muted">Optional parking, 3D and panorama sections are absent in this sample.</p></aside></div><section class="panel" style="margin-top:22px"><h2>About the development</h2><p>A fictional residential development used to review the QONYS selection journey. Each apartment has its own availability and developer-defined delivered condition.</p></section>`}
function floor(){if(!visible())return restricted();return `${crumb()}<div class="row between"><div><h1>Building 1 · Floor 5</h1><p class="muted">Choose an available apartment.</p></div><span class="control">North ↑</span></div><div class="two"><section class="floorarea"><div class="apartments"><button class="unit" data-go="apartment"><strong>34</strong>3 rooms · 62.8 m²<br><span class="status">Available</span></button><div class="unit yellow"><strong>35</strong>2 rooms · 48.6 m²<br><span class="status yellow">Reserved</span></div></div><div class="corridor">Shared corridor and lift lobby</div><div class="unit red"><strong>36</strong>2 rooms · 51.2 m²<br><span class="status red">Sold</span></div></section><aside class="panel"><h2>Available apartment 34</h2><p>3 rooms · 62.8 m² · 1 bathroom</p><p>Standard condition: No finish</p><p class="price">${price(30900000)}</p><button class="primary" data-go="apartment">View apartment</button><p class="sub muted">Reserved and sold regions are identified by both colour and text.</p></aside></div>`}
function apartment(){if(!visible())return restricted();const c=choices[state.finish];return `${crumb()}<div class="two"><section class="panel"><div class="row between"><h1>Apartment 34</h1><span class="status">Available</span></div>${plan()}<div class="row"><span class="control">Apartment layout</span><button data-go="floor">On the floor</button></div></section><aside class="panel"><div class="eyebrow">${project()} · Building 1</div><h2>Your apartment</h2><div class="facts"><div class="fact"><span>Rooms</span>3</div><div class="fact"><span>Area</span>62.8 m²</div><div class="fact"><span>Floor</span>5</div><div class="fact"><span>Bathrooms</span>1</div></div><div class="price" aria-live="polite">${price(c.price)}</div><label class="field">Finishing<select id="finishing">${Object.entries(choices).map(([id,x])=>`<option value="${id}" ${id===state.finish?'selected':''}>${x.name}${id==='base'?' · Standard':''} — ${price(x.price)}</option>`).join('')}</select></label><p class="muted">${c.description}</p><div class="actions"><button class="primary" data-go="enquiry">Contact the developer</button><button id="favourite">Save to favourites</button><button id="add-compare">Add to comparison</button></div><div id="apartment-message" aria-live="polite"></div></aside></div>`}
function enquiry(){if(!visible())return restricted();const c=choices[state.finish];if(state.buyer!=='verified')return `${crumb()}<section class="panel" style="max-width:620px;margin:auto"><h1>Sign in to send an enquiry</h1><p>Your selected apartment and finishing will be kept.</p><div class="notice">Apartment 34 · ${safe(c.name)} · ${price(c.price)}</div><button class="primary" id="signin-enquiry">Sign in</button><button data-go="apartment">Back to apartment</button></section>`;if(state.enquiry)return `<section class="panel" style="max-width:680px;margin:auto"><span class="status">Enquiry created</span><h1 style="margin-top:18px">The developer can follow up</h1><p>Apartment 34 · ${safe(state.enquiry.finish)} · ${price(state.enquiry.price)}</p><p>Status: <strong>${state.enquiryStatus}</strong></p><p class="muted">The submitted property and price context remains in this enquiry.</p><button data-go="developer">View the developer inbox example</button></section>`;return `${crumb()}<div class="two"><section class="panel"><h1>Contact the developer</h1><p class="muted">Your enquiry will include the selected apartment.</p><form id="enquiry-form"><label class="field">Name<input name="name" value="Alex" required autocomplete="given-name"></label><label class="field">Surname<input name="surname" value="Buyer" required autocomplete="family-name"></label><label class="field">Phone<input name="phone" value="+7 700 000 0000" required autocomplete="tel"></label><label class="field">Comment <span class="sub muted">Optional</span><textarea name="comment"></textarea></label><button class="primary" type="submit">Send enquiry</button></form></section><aside class="panel"><h2>Selected apartment</h2><p>${project()} · Building 1 · Floor 5</p><p>Apartment 34 · 3 rooms · 62.8 m²</p><p>${safe(c.name)}</p><p class="price">${price(c.price)}</p><p class="muted">An enquiry is a contact request. It does not reserve or purchase the apartment.</p></aside></div>`}
function comparison(){return `<h1>Compare apartments</h1><p class="muted">Up to four individual apartments. Selected finishing is preserved.</p>${state.compare.length?`<div class="compare">${state.compare.map(x=>`<section class="panel"><h2>Apartment 34</h2><p>${safe(x.project)} · Sample Developer</p>${plan()}<p>Astana · Building 1 · Floor 5</p><p>3 rooms · 62.8 m² · 1 bathroom</p><p>${safe(x.finish)} · ${price(x.price)}</p><span class="status">${visible()?'Available':'Development hidden'}</span></section>`).join('')}</div>`:'<div class="empty">Add an apartment from its details page.</div>'}<p><button data-go="apartment">Back to apartment</button></p>`}
function developer(){const tabs=['My developments','Floor plans','Preview and publication','Enquiries'];let body='';if(state.developerTab==='Enquiries'){body=`<h1>Enquiries</h1>${state.enquiry?`<section class="panel"><h2>Apartment 34 · ${safe(state.enquiry.finish)}</h2><p>Submitted price: ${price(state.enquiry.price)}</p><p>${safe(state.enquiry.name)} ${safe(state.enquiry.surname)} · ${safe(state.enquiry.phone)}</p><p>${safe(state.enquiry.project)}</p><label class="field">Processing status<select id="enquiry-status">${['New','In progress','Processed','Cancelled'].map(x=>`<option ${x===state.enquiryStatus?'selected':''}>${x}</option>`).join('')}</select></label></section>`:'<div class="empty">No enquiries in the local example yet.</div>'}`}else if(state.developerTab==='Preview and publication'){body=`<div class="row between"><div><div class="eyebrow">River Court</div><h1>Preview and publication</h1></div><span class="status ${state.publishedDraft?'':'yellow'}">${state.publishedDraft?'Published':'Private draft'}</span></div><section class="panel"><h2>General description</h2><label class="field">Russian<textarea readonly>Пример описания жилого комплекса.</textarea></label><label class="field">Kazakh<textarea readonly>Тұрғын үй кешенінің сипаттамасы.</textarea></label><label class="field">English<textarea id="draft-description" placeholder="Enter the English description">${safe(state.draftEn)}</textarea></label><div class="notice ${state.draftEn.trim()?'':'error'}" id="publication-check">${state.draftEn.trim()?'Required sample data complete. Optional media is absent.':'Publication blocked: the English general description is missing.'}</div><p class="sub muted">Identity, location, construction data, linked plans and apartment records are prefilled in this design fixture. Additional finishing, example photos, parking, 3D and panoramas are not required for this example.</p><div class="row"><button id="save-draft">Save draft</button><button class="primary" id="publish" ${state.draftEn.trim()?'':'disabled'}>${state.publishedDraft?'Save public changes':'Publish development'}</button></div><div id="draft-message" aria-live="polite"></div></section>`}else if(state.developerTab==='My developments'){body=`<h1>My developments</h1>${state.hidden?`<div class="notice error">Demo Court is hidden by the administrator. Reason: ${safe(state.reason)}</div>`:''}${state.suspended?'<div class="notice error">Company access is suspended. Public developments are not shown.</div>':''}<div class="grid"><section class="panel"><h2>Demo Court</h2><p>${visible()?'Published':'Hidden'}</p><button data-dev="Floor plans">Edit floor plans</button></section><section class="panel"><h2>River Court</h2><p>${state.publishedDraft?'Published':'Private draft'}</p><button data-dev="Preview and publication">Continue editing</button></section></div>`}else{body=`<div class="eyebrow">Demo Court · Building 1 · Floor 5</div><h1>Review apartment regions</h1><p class="muted">Inspect the proposed area, adjust its position and link it to the correct physical apartment.</p><div class="two"><section class="panel"><svg class="illustration" viewBox="0 0 500 350" role="img" aria-label="Schematic floor plan with editable region overlay"><rect x="40" y="35" width="420" height="270" fill="#fff" stroke="#607b8b" stroke-width="9"/><path d="M240 35V135H460M40 205H240V305M340 135V305" fill="none" stroke="#607b8b" stroke-width="7"/><rect id="region" x="${50+state.shift}" y="45" width="180" height="145" fill="#71b8e24d" stroke="#2173a9" stroke-width="3"/><text x="125" y="120" font-size="22" fill="#1d4d6d">34</text><text x="350" y="95" font-size="22" fill="#607b8b">35</text><text x="130" y="270" font-size="22" fill="#607b8b">36</text></svg><div class="row"><button id="region-left">Move left</button><button id="region-right">Move right</button></div></section><aside class="panel"><h2>Selected region</h2><label class="field">Apartment<select id="region-apartment">${['34','35','36'].map(n=>`<option value="${n}" ${n===state.regionApartment?'selected':''}>${n} · Floor 5</option>`).join('')}</select></label><p class="sub muted">Schematic suggestion supplied by this prototype; no recognition model is running.</p><button class="primary" id="review-region">Confirm reviewed mapping</button><p id="region-result" aria-live="polite">${state.regionReviewed?'Mapping reviewed for apartment '+state.regionApartment+'.':'Awaiting developer review.'}</p></aside></div>`}return `<div class="sidebar"><aside class="side" aria-label="Developer scenario sections">${tabs.map(t=>`<button data-dev="${t}" class="${t===state.developerTab?'active':''}">${t}</button>`).join('')}</aside><div>${body}</div></div>`}
function admin(){const published=(visible()?1:0)+(state.publishedDraft&&!state.suspended?1:0);return `<div class="eyebrow">Administration</div><h1>Platform overview</h1><div class="grid" style="margin:20px 0"><div class="panel"><span class="muted">Developers / buyers</span><h2 style="margin:12px 0 0">2 / 1</h2></div><div class="panel"><span class="muted">Published developments</span><h2 style="margin:12px 0 0">${published}</h2></div><div class="panel"><span class="muted">Hidden developments</span><h2 style="margin:12px 0 0">${(state.hidden||state.suspended?1:0)+(state.publishedDraft&&state.suspended?1:0)}</h2></div></div><div class="two"><section class="panel"><h2>Demo Court</h2><p>Sample Developer · ${visible()?'Public':'Hidden'}</p><label class="field">Reason visible to the developer<textarea id="hide-reason">${safe(state.reason)}</textarea></label><button class="primary" id="moderate">${state.hidden?'Restore development':'Hide development'}</button><div id="moderation-error" role="alert"></div></section><aside class="panel"><h2>Sample Developer</h2><p>Account: ${state.suspended?'Suspended':'Active'}</p><button id="company-access">${state.suspended?'Restore access':'Suspend access'}</button><p class="sub muted">Restoring company access preserves separate development restrictions and private drafts.</p></aside></div><section class="panel" style="margin-top:22px"><h2>Action history</h2><div class="audit">${state.audit.length?state.audit.map(x=>`<div>Administrator · ${safe(x)}</div>`).join(''):'<p class="muted">Local moderation actions appear here.</p>'}</div></section>`}
function restricted(){return '<div class="empty"><h1>Development unavailable</h1><p>This development is not currently public.</p><button data-go="catalogue">Back to catalogue</button></div>'}
function render(){document.querySelectorAll('.routes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.go===state.page)));document.getElementById('compare-count').textContent=state.compare.length;document.getElementById('account-button').textContent=state.buyer==='verified'?'Alex Buyer':'Sign in';document.getElementById('buyer-state').value=state.buyer;const views={catalogue,development,floor,apartment,enquiry,comparison,developer,admin};root.innerHTML=views[state.page]();}
function go(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'})}
function login(next){const modal=document.getElementById('modal');modal.hidden=false;modal.className='dialog-backdrop';modal.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="login-title"><h2 id="login-title">Sign in</h2><form id="login-form"><label class="field">Email<input type="email" required value="buyer@example.test" autocomplete="username"></label><label class="field">Password<input type="password" required value="ExampleOnly" autocomplete="current-password"></label><p class="sub muted">Design fixture: this account represents an already verified email.</p><div class="row"><button class="primary" type="submit">Sign in</button><button type="button" id="cancel-login">Cancel</button></div></form></section>`;modal.querySelector('input').focus();modal.querySelector('#cancel-login').onclick=()=>{modal.hidden=true};modal.querySelector('form').onsubmit=e=>{e.preventDefault();state.buyer='verified';modal.hidden=true;if(next)next();render()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.project){state.selected=b.dataset.project;state.finish='base';go('development');return}if(b.dataset.dev){state.developerTab=b.dataset.dev;go('developer');return}switch(b.id){case'account-button':login();break;case'signin-enquiry':login(()=>state.page='enquiry');break;case'favourite':if(state.buyer!=='verified')login();else document.getElementById('apartment-message').textContent='Saved to favourites in this local example.';break;case'add-compare':{const c=choices[state.finish];const key=state.selected+'-34';const found=state.compare.find(x=>x.id===key);if(found){found.finish=c.name;found.price=c.price}else if(state.compare.length<4)state.compare.push({id:key,project:project(),finish:c.name,price:c.price});render();document.getElementById('apartment-message').textContent='Selected finishing saved in comparison.';break}case'open-assistant':state.assistant=true;render();break;case'close-assistant':state.assistant=false;render();break;case'region-left':state.shift=Math.max(-6,state.shift-4);state.regionReviewed=false;render();break;case'region-right':state.shift=Math.min(12,state.shift+4);state.regionReviewed=false;render();break;case'review-region':state.regionReviewed=true;render();break;case'save-draft':document.getElementById('draft-message').textContent='Draft saved in this prototype session.';break;case'publish':if(state.draftEn.trim()){state.publishedDraft=true;render()}break;case'moderate':if(state.hidden){state.hidden=false;state.audit.unshift('Development restored');render()}else{const r=document.getElementById('hide-reason').value.trim();if(!r){document.getElementById('moderation-error').textContent='Enter a reason before hiding the development.';return}state.reason=r;state.hidden=true;state.audit.unshift('Development hidden: '+r);render()}break;case'company-access':state.suspended=!state.suspended;state.audit.unshift('Developer access '+(state.suspended?'suspended':'restored'));render();break;}});
document.addEventListener('change',e=>{if(e.target.id==='buyer-state'){state.buyer=e.target.value;render()}if(e.target.id==='region-apartment'){state.regionApartment=e.target.value;state.regionReviewed=false;document.getElementById('region-result').textContent='Awaiting developer review.';}if(e.target.id==='finishing'){state.finish=e.target.value;render();document.getElementById('finishing').focus()}if(e.target.id==='enquiry-status'){state.enquiryStatus=e.target.value;}});
document.addEventListener('input',e=>{if(e.target.id==='draft-description'){state.draftEn=e.target.value;document.getElementById('publish').disabled=!state.draftEn.trim();const msg=document.getElementById('publication-check');msg.textContent=state.draftEn.trim()?'Required sample data complete. Optional media is absent.':'Publication blocked: the English general description is missing.';msg.className='notice'+(state.draftEn.trim()?'':' error');}});
document.addEventListener('submit',e=>{if(e.target.id==='enquiry-form'){e.preventDefault();const c=choices[state.finish];const data=new FormData(e.target);state.enquiry={finish:c.name,price:c.price,project:project(),name:data.get('name'),surname:data.get('surname'),phone:data.get('phone'),comment:data.get('comment')};state.enquiryStatus='New';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').hidden=true;});render();
})();
</script>
</body></html>
